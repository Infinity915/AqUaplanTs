# Ground truth mask ID = YOLO ID + 1 (Mask 0 = unannotated background).
# Evaluated classes (20 testable species): 0,1,2,3,4,5,6,8,12,18,19,21,23,24,25,26,28,29,30 (YOLO ids).
# Rare train-only (12 species excluded from mean mIoU): 7,9,10,11,13,14,15,16,17,20,22,27 (YOLO ids).
# Train (Ultralytics BCEcls only — NO custom loss possible; use cls weights via
# `cls` gain + oversampling rares x3 in exporter/mosaic instead):
# yolo segment train model=best_binary.pt data=aqua32.yaml imgsz=640 batch=8 epochs=40 freeze=10 patience=12 optimizer=AdamW amp=True workers=2 cache=disk copy_paste=0.5 resume=True save_period=10 plots=False
