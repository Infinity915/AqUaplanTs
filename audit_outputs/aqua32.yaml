# AqUavplant MULTICLASS seg — Ultralytics format (v3 FIXED)
# Tiles: audit_outputs/tiles/t640_o128_minfg0.01_bg0.05/{images}
# Labels: .../labels_multi/*.txt (from export_yolo_labels.py)
# v3 FIX: YOLO ids are 0..30 = mask ids 1..31 MINUS 1. Mask 0 (background,
# 79.28% of pixels) is unannotated negative, never a target. v2's
# `0: background ... 31: CLASS_31` (32 ids) was WRONG and would crash/misalign.
# Warm-start from best binary weights (staged). Paper metric on EVALUATED
# classes only (see evaluated_classes.json: 20 classes with train+test
# coverage); 12 rare_train_only classes reported separately, excluded from mean.
path: tiles/t640_o128_minfg0.01_bg0.05
train: tile_lists/train.txt
val: tile_lists/val.txt
test: tile_lists/test.txt
names:
  0: Water_Iris
  1: Keshordam
  2: Lily_Pad
